<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Koa Pro Detail — Springbok Polo Banner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { background: #333; }

    .banner {
      position: relative;
      width: 7200px;
      height: 4800px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #070e18;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER PHOTO ── */
    .header-photo {
      position: relative;
      width: 100%;
      height: 2050px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .header-photo > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 55% 65%;
    }

    .header-scrim-bottom {
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom,
        rgba(7,14,24,0.0) 0%,
        rgba(7,14,24,0.05) 45%,
        rgba(7,14,24,0.55) 78%,
        rgba(7,14,24,1) 100%
      );
    }

    .header-scrim-side {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(7,14,24,0.75) 0%, rgba(7,14,24,0.0) 42%);
    }

    .header-brand {
      position: absolute;
      left: 190px;
      bottom: 70px;
      display: flex;
      align-items: center;
      gap: 46px;
    }

    .brand-icon {
      height: 560px;
      width: 560px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 10px 30px rgba(0,0,0,0.5));
      flex-shrink: 0;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 240px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      line-height: 1;
      text-shadow: 0 6px 30px rgba(0,0,0,0.5);
    }

    /* ── LOWER SECTION ── */
    .lower {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: linear-gradient(150deg, #070e18 0%, #0d1b2a 58%, #081020 100%);
    }

    .bg-glow-1 {
      position: absolute;
      top: -10%;
      right: -12%;
      width: 60%;
      height: 90%;
      background: radial-gradient(circle, rgba(59,189,245,0.16) 0%, rgba(59,189,245,0) 68%);
    }

    .bg-glow-2 {
      position: absolute;
      bottom: -20%;
      left: -10%;
      width: 55%;
      height: 70%;
      background: radial-gradient(circle, rgba(59,189,245,0.12) 0%, rgba(59,189,245,0) 65%);
    }

    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    .content {
      position: relative;
      height: 100%;
      padding: 90px 190px 100px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* ── HERO ── */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    .hero-line1 {
      font-family: 'Playfair Display', serif;
      font-weight: 800;
      font-size: 400px;
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #FFFFFF;
    }

    .hero-line2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 210px;
      line-height: 1.05;
      color: #3BBDF5;
    }

    .hero-line3 {
      margin-top: 26px;
      font-size: 100px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }

    /* ── OFFER BAR ── */
    .offer-bar {
      background: rgba(13, 27, 42, 0.85);
      border: 4px solid rgba(59,189,245,0.6);
      border-radius: 26px;
      padding: 56px 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 140px;
      box-shadow: 0 40px 90px rgba(0,0,0,0.5), 0 12px 50px rgba(59,189,245,0.14);
    }

    .offer-left {
      display: flex;
      align-items: center;
      gap: 80px;
    }

    .offer-copy { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

    .offer-eyebrow {
      font-size: 66px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #3BBDF5;
    }

    .offer-amount {
      font-family: 'Playfair Display', serif;
      font-size: 340px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 0.9;
      letter-spacing: -0.02em;
    }

    .offer-amount span {
      font-size: 96px;
      font-weight: 600;
      color: rgba(255,255,255,0.65);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      margin-left: 20px;
    }

    .offer-divider {
      width: 4px;
      align-self: stretch;
      background: rgba(59,189,245,0.35);
    }

    .offer-code-block { display: flex; flex-direction: column; gap: 18px; align-items: flex-start; }

    .offer-code-label {
      font-size: 62px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.65);
    }

    .offer-code-pill {
      border: 4px solid #3BBDF5;
      border-radius: 14px;
      padding: 30px 56px;
      font-size: 128px;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #3BBDF5;
      white-space: nowrap;
    }

    /* ── FOOTER ── */
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 90px;
    }

    .qr-img {
      width: 900px;
      height: 900px;
      border-radius: 32px;
      background: #fff;
      padding: 30px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45), 0 0 0 6px rgba(59,189,245,0.4);
      flex-shrink: 0;
    }

    .contact-info { display: flex; flex-direction: column; gap: 28px; }

    .contact-eyebrow {
      font-size: 78px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #3BBDF5;
    }

    .contact-row {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 130px;
      font-weight: 700;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .contact-dot {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #3BBDF5;
      flex-shrink: 0;
    }

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      html, body { background: none; margin: 0; }
      @page { size: 72in 48in; margin: 0; }
    }
  </style>
</head>
<body>
<div class="banner">

  <!-- HEADER PHOTO -->
  <div class="header-photo">
    <img src="http://localhost:3000/g%20wagon%20charleston.PNG" alt="Mercedes-AMG G63 detailed by Koa Pro Detail">
    <div class="header-scrim-side"></div>
    <div class="header-scrim-bottom"></div>
    <div class="header-brand">
      <img class="brand-icon" src="http://localhost:3000/koa-logo-transparent.png" alt="Koa Pro Detail">
      <div class="brand-name">Koa Pro Detail</div>
    </div>
  </div>

  <!-- LOWER SECTION -->
  <div class="lower">
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="grain"></div>

    <div class="content">

      <!-- HERO -->
      <div class="hero">
        <div class="hero-line1">Luxury Mobile Detailing</div>
        <div class="hero-line2">Serving Northern Virginia</div>
        <div class="hero-line3">We Come To You &nbsp;&middot;&nbsp; Owner-Operated</div>
      </div>

      <!-- OFFER BAR -->
      <div class="offer-bar">
        <div class="offer-left">
          <div class="offer-copy">
            <div class="offer-eyebrow">Guest Exclusive</div>
            <div class="offer-amount">$30<span>Off</span></div>
          </div>
          <div class="offer-divider"></div>
        </div>
        <div class="offer-code-block">
          <div class="offer-code-label">Use Code</div>
          <div class="offer-code-pill">NOVA30</div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer-row">
        <img class="qr-img"
             src="https://api.qrserver.com/v1/create-qr-code/?size=900x900&data=https%3A%2F%2Fwww.instagram.com%2Fkoaprodetail%2F&bgcolor=FFFFFF&color=070E18&qzone=1"
             alt="Instagram QR Code">
        <div class="contact-info">
          <div class="contact-eyebrow">Scan To Book</div>
          <div class="contact-row"><div class="contact-dot"></div>koaprodetail.com</div>
          <div class="contact-row"><div class="contact-dot"></div>(703) 935-4676</div>
        </div>
      </div>

    </div>
  </div>
</div>
</body>
</html>
